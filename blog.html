<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Blog</title> 

        <!--Bootstrap css stylesheet-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!--Bootstrap icons css stylesheet-->
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> 

        <!--my custom css stylesheet-->
        <link rel="Stylesheet" href="styles.css">

        
    </head>
    <body class="page-blog">

        <!--Dynamically loaded navigation bar made with Bootstrap-->
        <div id="header-placeholder"></div>

        
        <div class="textbox">
            <!--Blog container-->
            <div id="blogContainer">
                <h1>Let's Talk</h1>
            </div> 
        </div>
        

        <!--Dynamically loaded footer made with Bootstrap-->
        <div id="footer-placeholder"></div>

        <!--Theme switch javascript-->
        <script src="js/theme.js"></script>

        <!--Dynamic header and footer javascript-->
        <script src="js/components.js"></script>

        <!--Dynamic blog/news section javascript-->
        <script src="js/blog.js"></script>

        <!--Bootstrap javascript-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
