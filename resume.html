<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Resume Showcase</title> 

        <!--Bootstrap css stylesheet-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!--Bootstrap icons css stylesheet-->
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> 

        <!--my custom css stylesheet-->
        <link rel="Stylesheet" href="styles.css">

        <!--Internal stylesheet for pdf-->
        <style>
            #pdfHolder {
                display: flex;
                gap: 10px;
                align-items: center;
                text-align: left;
                width: 100%;
                padding: 20px;
                margin-bottom: 20px;
            }

            #resumeFrame {
                width: 100%;
                height: 900px;
            }
        </style>
    </head>
    <body class="page-resume">

        <!--Dynamically loaded navigation bar made with Bootstrap-->
        <div id="header-placeholder"></div>

        <!--Main body resume showcase-->
        <div>
            <div id="pdfHolder">
                <h1> My Resume</h1>

                <!--Embedded PDF and Download button using Bootstrap-->
                <a class="btn btn-primary ms-auto" href="Abilaksan_Logathasan_GeneralResume.pdf" download><i class="bi bi-download"></i> Download</a>
            </div>
            <iframe id="resumeFrame" src="Abilaksan_Logathasan_GeneralResume.pdf#toolbar=0"></iframe>
        </div>
        
        
        <!--Dynamically loaded footer made with Bootstrap-->
        <div id="footer-placeholder"></div>

        <!--Theme switch javascript-->
        <script src="js/theme.js"></script>

        <!--Dynamic header and footer javascript-->
        <script src="js/components.js"></script>

        <!--Bootstrap javascript-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
